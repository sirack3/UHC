# ============================================================
# UHC 커스텀 조합법 정의 파일
# 새 레시피를 추가하려면 아래 형식에 맞춰 항목만 추가하면 됩니다.
# ============================================================
#
# 필드 설명:
#   id           : 레시피 고유 키 (NamespacedKey)
#   tag          : 아이템 이름 (색상 코드 없이)
#   nameColor    : 아이템 이름 색상 (ChatColor 이름)
#   maxCrafts    : 플레이어당 최대 제작 횟수
#   result       : 결과 아이템 (material, amount)
#   type         : shaped / shapeless
#   shape        : 3줄 패턴 (shaped일 때)
#   ingredients  : 문자 → 재료 매핑
#   enchantments : 인챈트 목록 (enchant: level)
#   storedEnchantments : 마법부여 책 전용
#   lore         : 아이템 설명 목록
#   itemFlags    : HIDE_ENCHANTS 등
#   attributes   : 커스텀 어트리뷰트
#   damage       : 내구도 손상값 (Damageable)
#   potionEffects: 포션 효과 목록
#   potionColor  : 포션 색상
#   guiPage      : 조합법 도감 페이지 (1~3)
#   guiSlot      : 도감 내 슬롯 번호
#   notify       : 재료 획득 시 알림 조건
#     triggerMaterials : 알림 트리거 재료 목록
#     requirements     : 필요 재료와 수량
#   special      : 특수 처리 필요 여부 (golden_head, fusion_armor 등)
#   materialChoice : 여러 재료 중 하나를 사용하는 슬롯 정의
#   shapelessChoices: 그룹 또는 다중 재료를 사용하는 무정형 슬롯 정의
#   randomResults: 여러 재료 중 무작위 1종을 결과물로 생성

materialGroups:
  _MEAT: [PORKCHOP, BEEF, MUTTON, CHICKEN, RABBIT, COD, SALMON]
