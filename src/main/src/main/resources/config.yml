# UHC 플러그인 설정

border:
  # 게임 시작 시 초기 월드 보더 크기 (지름, 블록)
  initial-size: 2000
  # 최종 월드 보더 크기 (지름, 블록)
  final-size: 10
  # 게임 시작 후 PVP 허용 및 보더 축소가 시작되는 시간 (분)
  shrink-start-min: 10
  # 축소가 완료되기까지 걸리는 시간 (분)
  shrink-duration-min: 30

game:
  # 시작 카운트다운 시간 (초)
  countdown-seconds: 10
  # 킬 시 골든 애플 지급 여부
  kill-reward-golden-apple: true
  # 스캐터 반경 (보더 초기 크기 절반보다 작아야 함, 블록)
  scatter-radius: 900
  # 스캐터 최소 이격 거리 (블록)
  scatter-min-distance: 100
  # 게임 시작 시 기본 최대 체력 (HP, 40.0 = 2줄)
  player-health: 40.0
  # 팀 모드에서 짝이 맞지 않아 혼자 배정된 플레이어 최대 체력 (HP, 80.0 = 4줄)
  team-solo-buff-health: 80.0
  # 시작 지급 흡수량 (HP, 10.0 = 5칸)
  initial-absorption: 10.0
  # 과도기 무기 자동 강화 시간 설정 (PVP 시작 후 경과 시간, 분)
  upgrades:
    # 견습용 활 힘 II 강화 시간 (기본: PVP 시작 후 15분)
    bow-tier2-min: 15
    # 견습용 검 날카로움 II 강화 시간 (기본: PVP 시작 후 25분)
    sword-tier2-min: 25
    # 견습용 활 힘 III 강화 시간 (기본: PVP 시작 후 25분)
    bow-tier3-min: 25
